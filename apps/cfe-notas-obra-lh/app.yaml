command:
  - python
  - app.py

env:
  # Recomendado: ligar el SQL Warehouse como recurso de la app con la llave "sql-warehouse"
  # (requiere CAN_MANAGE sobre el warehouse). Esto otorga CAN_USE al service principal.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Alternativa sin recurso: reemplazar las dos lineas anteriores por
  #   value: "<WAREHOUSE_ID>"
  # y pedir al duenio del warehouse que otorgue CAN_USE al service principal de la app.
  - name: CFE_CATALOG
    value: "dipidev"
  - name: CFE_SCHEMA
    value: "default"
